[project]
name = "voice-latency-lab"
version = "0.1.0"
description = "A starter for multilingual voice agents: EN/NL/AR reply-language switching with hysteresis, speculative generation on interim transcripts, and a per-turn latency harness."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = []

[project.urls]
Repository = "https://github.com/AfifiNL/voice-latency-lab"

[project.scripts]
voice-lab = "voice_lab.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF001"]  # tests contain Arabic and Persian text on purpose
"scripts/**" = ["S101"]
"src/voice_lab/language.py" = ["SIM905", "RUF001"]  # word lists (incl. Arabic) as split strings
"src/voice_lab/switch_requests.py" = ["RUF001"]  # Arabic patterns on purpose

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["voice_lab"]
mypy_path = "src"
